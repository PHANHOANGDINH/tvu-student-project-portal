name: ${COMPOSE_PROJECT_NAME:-tvu-student-project-portal-prod}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

services:
  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - private

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-tvu_student_project_portal}
    volumes:
      - sqlserver_data:/var/opt/mssql
      - sqlserver_backups:/var/opt/mssql/backup
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - private

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-tvu_student_project_portal}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./database/schema-baseline.sql:/schema/schema-baseline.sql:ro
      - ./docker/sql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/init.sh"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    networks:
      - private

  database-seed:
    image: ${BACKEND_IMAGE:-tvu-student-project-portal-backend:latest}
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      DB_SERVER: database
      DB_DATABASE: ${DB_DATABASE:-tvu_student_project_portal}
      DB_PORT: 1433
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      DOCKER_SEED_ADMIN_EMAIL: ${DOCKER_SEED_ADMIN_EMAIL:-}
      DOCKER_SEED_ADMIN_PASSWORD: ${DOCKER_SEED_ADMIN_PASSWORD:-}
    command: ["node", "src/scripts/seedAdmin.js"]
    depends_on:
      database-init:
        condition: service_completed_successfully
    restart: "no"
    logging: *default-logging
    networks:
      - private

  backend:
    image: ${BACKEND_IMAGE:-tvu-student-project-portal-backend:latest}
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      DB_SERVER: database
      DB_DATABASE: ${DB_DATABASE:-tvu_student_project_portal}
      DB_PORT: 1433
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      database-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5000/api/health')
          .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - private

  notification-worker:
    image: ${BACKEND_IMAGE:-tvu-student-project-portal-backend:latest}
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
      DB_SERVER: database
      DB_DATABASE: ${DB_DATABASE:-tvu_student_project_portal}
      DB_PORT: 1433
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-10}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-5000}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-2000}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-20}
    command: ["npm", "run", "worker:notifications"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('fs').stat('/tmp/notification-worker-ready',
          (e,s)=>process.exit(e||Date.now()-s.mtimeMs>30000?1:0))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - private

  frontend:
    image: ${FRONTEND_IMAGE:-tvu-student-project-portal-frontend:latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - private

  proxy:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-25m}
      NGINX_ENVSUBST_FILTER: ^(DOMAIN|CLIENT_MAX_BODY_SIZE)$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --no-check-certificate --tries=1 --spider https://127.0.0.1/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    networks:
      - private
      - public

  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    ports:
      - "80:80"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["certbot"]
    restart: "no"
    logging: *default-logging
    networks:
      - public

  uploads-backup:
    image: alpine:3.21
    profiles: ["tools"]
    environment:
      BACKUP_FILE: ${BACKUP_FILE:-uploads.tar.gz}
    volumes:
      - backend_uploads:/uploads:ro
      - sqlserver_backups:/backup
    command:
      - sh
      - -c
      - tar -czf "/backup/$$BACKUP_FILE" -C /uploads .
    restart: "no"
    networks:
      - private

volumes:
  sqlserver_data:
  sqlserver_backups:
  backend_uploads:
  letsencrypt:
  certbot_webroot:
  rabbitmq_data:

networks:
  public:
  private:
    internal: true
