groups:
  - name: tvu-portal
    rules:
      - alert: BackendUnavailable
        expr: up{job="backend"} == 0
        for: 2m
      - alert: NotificationWorkerUnavailable
        expr: up{job="notification-worker"} == 0 or time() - tvu_notification_worker_heartbeat_timestamp_seconds > 60
        for: 2m
      - alert: SqlServerUnavailable
        expr: tvu_database_up == 0
        for: 2m
      - alert: RabbitMqUnavailable
        expr: up{job="rabbitmq"} == 0
        for: 2m
      - alert: HighHttp5xxRate
        expr: sum(rate(tvu_http_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
      - alert: RabbitQueueBacklog
        expr: sum(rabbitmq_queue_messages_ready) > 1000
        for: 10m
      - alert: OutboxPendingTooLong
        expr: tvu_outbox_events{status="Pending"} > 100
        for: 15m
      - alert: OutboxFailures
        expr: tvu_outbox_events{status="Failed"} > 0
        for: 1m
      - alert: NotificationDeadLetters
        expr: rabbitmq_queue_messages{queue=~".*dead.*"} > 0
        for: 1m
      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        for: 5m
      - alert: ContainerFilesystemNearlyFull
        expr: (container_fs_usage_bytes{name!=""} / container_fs_limit_bytes{name!=""}) > 0.85
        for: 10m
