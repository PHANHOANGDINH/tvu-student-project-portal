global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: backend
    metrics_path: /internal/metrics
    static_configs: [{ targets: ["backend:5000"] }]
  - job_name: notification-worker
    static_configs: [{ targets: ["notification-worker:9464"] }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
