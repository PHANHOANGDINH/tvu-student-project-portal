name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Check JavaScript syntax
        working-directory: backend
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        working-directory: backend
        run: npm test
      - name: Validate Swagger specification
        working-directory: backend
        run: >-
          node -e "import('./src/docs/swagger.js')
          .then(({ swaggerSpec }) => {
            if (swaggerSpec?.openapi !== '3.0.0' || !swaggerSpec?.paths) process.exit(1);
          })
          .catch(() => process.exit(1))"

  docker:
    name: Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare isolated CI environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sql_password="Ci!$(openssl rand -hex 24)Aa9"
          jwt_secret="$(openssl rand -hex 48)"
          rabbit_password="$(openssl rand -hex 32)"
          {
            echo "MSSQL_SA_PASSWORD=${sql_password}"
            echo "DB_DATABASE=tvu_student_project_portal"
            echo "SQL_SERVER_PORT=1433"
            echo "JWT_SECRET=${jwt_secret}"
            echo "JWT_EXPIRES_IN=1h"
            echo "BCRYPT_SALT_ROUNDS=10"
            echo "DOCKER_SEED_ADMIN_EMAIL="
            echo "DOCKER_SEED_ADMIN_PASSWORD="
            echo "FRONTEND_PORT=8080"
            echo "BACKEND_PORT=5000"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:8080"
            echo "RABBITMQ_USER=ci_worker"
            echo "RABBITMQ_PASSWORD=${rabbit_password}"
            echo "RABBITMQ_VHOST=/"
          } > .env
          echo "COMPOSE_PROJECT_NAME=tvu-ci-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for healthy containers
        shell: bash
        run: |
          set -euo pipefail
          wait_for_health() {
            local service="$1"
            local container_id
            container_id="$(docker compose ps -q "$service")"
            if [[ -z "$container_id" ]]; then
              echo "${service} container was not created" >&2
              return 1
            fi
            for _ in {1..60}; do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id")"
              if [[ "$status" == "healthy" ]]; then
                return 0
              fi
              if [[ "$status" == "unhealthy" || "$status" == "exited" || "$status" == "dead" ]]; then
                echo "${service} entered ${status}" >&2
                return 1
              fi
              sleep 5
            done
            echo "Timed out waiting for ${service}" >&2
            return 1
          }
          wait_for_health database
          wait_for_health rabbitmq
          wait_for_health notification-worker
          wait_for_health backend
          wait_for_health frontend
      - name: Check HTTP endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 http://localhost:5000/api/health > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 http://localhost:8080/ > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 http://localhost:5000/api-docs/ > /dev/null
      - name: Check restart counts
        shell: bash
        run: |
          set -euo pipefail
          for service in database rabbitmq notification-worker backend frontend; do
            container_id="$(docker compose ps -q "$service")"
            restart_count="$(docker inspect --format '{{.RestartCount}}' "$container_id")"
            if [[ "$restart_count" != "0" ]]; then
              echo "${service} restart count is ${restart_count}" >&2
              exit 1
            fi
          done
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
